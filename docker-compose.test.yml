# ============================================================
# SOLO PRUEBAS LOCALES. NO USAR EN PRODUCCION.
#
# Levanta un MySQL 8.4 desechable con credenciales ficticias y la aplicacion
# apuntando a el. Sirve para validar docker build/run y el healthcheck sin
# tocar la base productiva.
#
# Uso:
#   docker compose -f docker-compose.test.yml up -d --build
#   curl -i http://127.0.0.1:3001/api/salud
#   docker compose -f docker-compose.test.yml logs -f app
#   docker compose -f docker-compose.test.yml down
#
# Los datos de prueba quedan en el volumen db_test_data. Para borrarlos:
#   docker compose -f docker-compose.test.yml down -v
# ============================================================
name: sistema-control-horas-test

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: paredescano_test
      MYSQL_USER: test_app
      MYSQL_PASSWORD: test_app_password
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      # Solo accesible desde el host local, nunca desde la red.
      - "127.0.0.1:${TEST_DB_PORT:-3307}:3306"
    volumes:
      - db_test_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
    image: sistema-control-horas:test
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: America/Lima
      LOG_LEVEL: info
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: test_app
      DB_PASSWORD: test_app_password
      DB_NAME: paredescano_test
      SETUP_TOKEN: test-setup-token
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:${TEST_APP_PORT:-3001}:3000"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_test_data:
    name: sistema-control-horas-test-db
